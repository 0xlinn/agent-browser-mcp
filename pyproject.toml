[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser-mcp"
version = "0.2.2"
description = "Real-browser MCP server with TMWebDriver/CDP bridge, screenshots, cookies, and physical input"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "0xlinn" }
]
keywords = ["mcp", "browser automation", "chrome", "cdp", "tmwebdriver", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities"
]
dependencies = [
  "mcp",
  "requests",
  "beautifulsoup4",
  "bottle",
  "simple-websocket-server",
  "pyautogui",
  "mss",
  "pillow"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/0xlinn/agent-browser-mcp"
Repository = "https://github.com/0xlinn/agent-browser-mcp"
Issues = "https://github.com/0xlinn/agent-browser-mcp/issues"

[project.scripts]
agent-browser-mcp = "agent_browser_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_browser_mcp = ["chrome_extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests drive the user's real browser through a running bridge, so they are
# opt-in: plain `pytest` runs only the offline layer. Use `-m live` for the rest.
addopts = "-m 'not live'"
markers = [
  "live: needs the bridge daemon and the Chrome extension connected",
]
